name: Build AutoSeller
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Build
        run: mvn clean package -B
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoSeller
          path: target/*.jar
